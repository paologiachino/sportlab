# docker is added once the Dockerfiles exist
# (Dependabot reports an error when it cannot find the files to check).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: staging

  # Backend Python dependencies, managed with uv (backend/uv.lock)
  - package-ecosystem: uv
    directory: "/backend"
    schedule:
      interval: monthly
    target-branch: staging

  # Frontend dependencies (frontend/package-lock.json). Angular packages move
  # together, so they arrive in one pull request; majors go through ng update.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    target-branch: staging
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
          - "angular-eslint"
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
