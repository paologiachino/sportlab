name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  struttura:
    name: Structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files
        run: |
          for f in README.md LICENSE CLAUDE.md .env.example .gitignore; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: No secrets file
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked in the repository"; exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Does the backend exist?
        id: has
        run: |
          if [ -f backend/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.has.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.has.outputs.present == 'true'
        run: pip install -e "backend[dev]"
      - name: Style check (Ruff)
        if: steps.has.outputs.present == 'true'
        run: ruff check backend && ruff format --check backend
      - name: Test
        if: steps.has.outputs.present == 'true'
        run: pytest backend/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Does the frontend exist?
        id: has
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.has.outputs.present == 'true'
        run: npm ci
        working-directory: frontend
      - name: Style check
        if: steps.has.outputs.present == 'true'
        run: npm run lint --if-present
        working-directory: frontend
      - name: Test
        if: steps.has.outputs.present == 'true'
        run: npm test --if-present
        working-directory: frontend
      - name: Build
        if: steps.has.outputs.present == 'true'
        run: npm run build
        working-directory: frontend

  segreti:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by gitleaks to read the commits of the pull request
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
