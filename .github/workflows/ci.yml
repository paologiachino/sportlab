name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  struttura:
    name: Structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required files
        run: |
          for f in README.md LICENSE CLAUDE.md .env.example .gitignore; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: No secrets file
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked in the repository"; exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Throwaway database for the tests, discarded with the job: the credentials
    # below exist only inside this container and are not secrets.
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The tests use the two roles of the development database, created below by
    # the same script as the development Compose.
    env:
      SPORTLAB_APP_PASSWORD: ci_app
      SPORTLAB_MIGRATOR_PASSWORD: ci_migrator
      DATABASE_URL: postgresql+psycopg://sportlab_dev_app:ci_app@localhost:5432/sportlab_dev
      DATABASE_MIGRATION_URL: postgresql+psycopg://sportlab_dev_migrator:ci_migrator@localhost:5432/sportlab_dev
    steps:
      - uses: actions/checkout@v7
      - name: Does the backend exist?
        id: has
        run: |
          if [ -f backend/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # uv reads the Python version from backend/.python-version.
      # Pinned to a commit: setup-uv publishes no floating major tag (no "v10").
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.has.outputs.present == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        if: steps.has.outputs.present == 'true'
        # --locked fails if uv.lock is out of date with pyproject.toml
        run: uv sync --locked
        working-directory: backend
      - name: Style check (Ruff)
        if: steps.has.outputs.present == 'true'
        run: uv run ruff check && uv run ruff format --check
        working-directory: backend
      # Service containers start before the checkout, so the script cannot be
      # mounted: it is copied in and run as the superuser, like Compose does.
      - name: Database roles
        if: steps.has.outputs.present == 'true'
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp docker/dev/postgres-init/20_sportlab.sh "$CONTAINER":/tmp/20_sportlab.sh
          docker exec -e SPORTLAB_APP_PASSWORD -e SPORTLAB_MIGRATOR_PASSWORD \
            "$CONTAINER" sh /tmp/20_sportlab.sh
      # As a deploy does: the migration role applies every migration
      - name: Migrations
        if: steps.has.outputs.present == 'true'
        run: uv run alembic upgrade head
        working-directory: backend
      - name: Test
        if: steps.has.outputs.present == 'true'
        run: uv run pytest
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Does the frontend exist?
        id: has
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.has.outputs.present == 'true'
        with:
          # Same Node.js version as local development
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.has.outputs.present == 'true'
        run: npm ci
        working-directory: frontend
      - name: Style check (ESLint, Prettier)
        if: steps.has.outputs.present == 'true'
        run: npm run lint && npm run format:check
        working-directory: frontend
      - name: Test
        if: steps.has.outputs.present == 'true'
        run: npm test -- --watch=false
        working-directory: frontend
      - name: Build
        if: steps.has.outputs.present == 'true'
        run: npm run build
        working-directory: frontend

  segreti:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by gitleaks to read the commits of the pull request
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
