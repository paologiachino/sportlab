info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/health"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

docs: |-
  Liveness check: the backend process is up and answering requests.

  Expected response: `200 {"status": "ok"}`. It does not touch the database.
