info:
  name: Me
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"

runtime:
  assertions:
    - expression: res.status
      operator: neq
      value: "500"

settings:
  encodeUrl: true

docs: |-
  The signed-in user: `id`, `email`, `display_name`, `status`, `role`.

  - `200`: signed in (also for `pending` and `disabled` accounts, so the
    interface can show "waiting for approval" or "access removed").
  - `401`: no access cookie, or it expired (call Refresh).

  The session lives in HttpOnly cookies set by the Google sign-in in a browser.
  To use it here, see "Using a browser session" in `bruno/README.md`.
