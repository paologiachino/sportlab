info:
  name: Me
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/auth/me"

runtime:
  assertions:
    - expression: res.status
      operator: neq
      value: "500"

settings:
  encodeUrl: true

docs: |-
  The signed-in user: `id`, `email`, `display_name`, `status`, `role`.

  - `200`: signed in (also for `pending` and `disabled` accounts, so the
    interface can show "waiting for approval" or "access removed").
  - `401`: no access cookie, or it expired (call Refresh).

  The session lives in HttpOnly cookies set by the Google sign-in in a browser.
  To use it here, sign in at http://localhost:8000/api/auth/google/login, then
  copy the `sportlab_access` and `sportlab_refresh` cookies from the browser's
  developer tools into Bruno's cookie manager for localhost. Never share them:
  they are a live session.
