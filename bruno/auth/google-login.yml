info:
  name: Google login
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/auth/google/login"

runtime:
  assertions:
    - expression: res.status
      operator: neq
      value: "500"

settings:
  encodeUrl: true
  followRedirects: false

docs: |-
  Starts the Google sign-in. Meant for a browser: open
  http://localhost:8000/api/auth/google/login there to sign in for real.

  - `302`: redirect to Google, with `state`, `nonce` and the PKCE challenge in
    the URL, and the signed login-state cookie set.
  - `303` to `/login?error=unavailable`: GOOGLE_CLIENT_ID and
    GOOGLE_CLIENT_SECRET are not set (see docs/google-oauth.md).

  Google then sends the browser to /api/auth/google/callback, which is not part
  of the API schema (only Google calls it). It opens the session, sets the
  HttpOnly session cookies and redirects to `/`; when the sign-in fails it
  redirects to `/login?error=<code>` (`cancelled`, `failed`,
  `unverified_email`, `unavailable`), which the frontend turns into a message.
