info:
  name: Disable
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/admin/users/:user_id/disable"
  params:
    - name: user_id
      value: ""
      type: path
  headers:
    - name: X-Requested-With
      value: XMLHttpRequest

runtime:
  assertions:
    - expression: res.status
      operator: neq
      value: "500"

settings:
  encodeUrl: true

docs: |-
  -> disabled, and every session of the user is revoked at once.
  The last active administrator cannot be disabled (409).

  Set `user_id` (Params tab) to an id from List users.
  `404` unknown user, `409` not possible in the user's current state,
  `401` not signed in, `403` not an active administrator.
