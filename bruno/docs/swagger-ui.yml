info:
  name: Swagger UI
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/docs"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

docs: |-
  Interactive API documentation (HTML page), generated by FastAPI.

  Best opened in a browser: http://127.0.0.1:8000/docs, where "Try it out"
  sends real requests.
